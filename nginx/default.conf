# nginx server config for the Rest Assured frontend SPA.
#
# Designed for the nginxinc/nginx-unprivileged image, which runs as the
# non-root "nginx" user (UID 101). A non-root process cannot bind to
# privileged ports (<1024), so we listen on 8080 — the unprivileged
# image's documented default. docker-compose is expected to map a host
# port to container 8080 (see docker-compose.yml / T25).
#
# Responsibilities:
#   - Serve the built Vite SPA with HTML5 history-API fallback.
#   - Reverse-proxy API traffic to the backend
#     (ghcr.io/mipt-pp-hackaton/rest_assured:latest), reachable inside the
#     compose network as the "backend" service. Backend listen port is
#     parameterised below and defaults to 8000.

# Backend upstream. The host "backend" resolves to the docker-compose
# service of the same name. Port 8000 is the assumed backend listen port;
# change here (and in docker-compose.yml) if the backend listens elsewhere.
#
# NOTE on lazy DNS resolution: we deliberately do NOT use an `upstream {}`
# block with a static `server backend:8000;`. nginx resolves such names at
# config-load time and aborts startup with "[emerg] host not found in
# upstream" whenever the name cannot be resolved (e.g. running the image
# standalone, or before the backend service is up). Instead each proxy block
# below sets a $backend variable and relies on the `resolver` directive, which
# defers DNS to request time. The container then always starts and serves the
# static SPA; an absent backend yields a 502 per request rather than blocking
# nginx from booting at all.
#
# 127.0.0.11 is Docker's embedded DNS server (available on user-defined and
# compose networks). ipv6=off avoids spurious AAAA lookups; the short valid
# TTL lets nginx pick up backend IP changes (rescheduled containers).
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# Hide the nginx version in error pages and the Server response header.
server_tokens off;

# gzip compression for text-based static assets.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    font/woff2;

server {
    # Unprivileged nginx default port. Non-root user can bind here.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version.
    server_tokens off;

    # ---- Security response headers ----
    # Applied at the server level so they cover `/` and the SPA fallback.
    # `always` makes them apply to error responses (4xx/5xx) too.
    #
    # IMPORTANT nginx add_header inheritance: a location block that declares
    # its own add_header REPLACES (does not merge with) inherited add_header
    # directives. The /assets/ and /index.html blocks below set their own
    # Cache-Control via add_header, so these security headers are repeated
    # there to avoid silently dropping them. Keep the two copies in sync.
    #
    # CSP rationale for this Vite/React SPA:
    #   - style-src 'unsafe-inline': recharts/React inject inline styles.
    #   - connect-src 'self': /api is reverse-proxied on the same origin.
    #   - img/font data: cover inlined assets and data-URI fonts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # ---- API reverse proxy ----
    # All backend API routes live under /api/. We also proxy the backend's
    # top-level /health probe and Prometheus /metrics endpoint (each in its own
    # block below). /api/health/scheduler is already
    # covered by the /api/ rule but is listed in the OpenAPI spec.
    location /api/ {
        # Lazy-resolved upstream (see `resolver` note at top of file). Using a
        # variable forces nginx to resolve "backend" at request time rather
        # than at startup. $request_uri preserves the full path + query string.
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through bearer auth tokens to the backend.
        proxy_set_header Authorization     $http_authorization;

        # Keep upstream connections alive (pairs with upstream keepalive).
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Backend top-level health probe (outside the /api/ prefix).
    location = /health {
        # Lazy-resolved upstream (see `resolver` note at top of file).
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
    }

    # ---- Prometheus metrics scrape endpoint ----
    # The backend exposes Prometheus metrics via a Starlette *mount* at the
    # ROOT path /metrics (see rest_assured .../observability/prometheus.py),
    # NOT under /api — so, like /health and the docs, it needs its own block.
    # The backend serves /metrics WITHOUT authentication (Prometheus scraping
    # convention; it assumes access is restricted at the network layer).
    #
    # EXPOSURE: this block bridges that unauthenticated endpoint onto the public
    # frontend origin (host port 8080), exactly like the open /docs, /redoc and
    # /openapi.json blocks — so anyone who can reach the SPA can scrape the
    # backend's operational metrics (scheduler timings, per-route latency, build
    # info, ...). That is an accepted, deliberate choice for this stack; if 8080
    # is internet-facing, restrict it at the edge instead — e.g. add
    # `allow <scrape-cidr>; deny all;` to both blocks, or front it with
    # auth_basic / a separate internal listener.
    #
    # Because /metrics is a mount, the backend 307-redirects a bare `/metrics`
    # to `/metrics/` and serves the exposition (text/plain; version=0.0.4) only
    # at `/metrics/`. We therefore proxy BOTH `/metrics` and `/metrics/`
    # straight to the backend's `/metrics/`, so scrapers get a clean 200 at the
    # conventional `/metrics` path with no redirect round-trip (and no risk of
    # the backend emitting an http:// Location while the client is on https).
    # $is_args$args is forwarded so prometheus_client's `?name[]=` family
    # filter keeps working. No Authorization pass-through (unauthenticated
    # endpoint). Access is logged (like /health) so scraping stays auditable.
    location = /metrics {
        # Lazy-resolved upstream (see `resolver` note at top of file).
        set $backend "backend:8000";
        proxy_pass http://$backend/metrics/$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location = /metrics/ {
        set $backend "backend:8000";
        proxy_pass http://$backend/metrics/$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---- Backend API documentation ----
    # FastAPI serves Swagger UI at /docs, ReDoc at /redoc and the schema at
    # /openapi.json — all at the ROOT, NOT under /api. They are proxied here so
    # they are reachable same-origin on this port. Swagger/ReDoc pull their JS
    # and CSS from a CDN and run an inline bootstrap script, so these locations
    # use a RELAXED Content-Security-Policy (the SPA routes keep the strict one
    # declared at the server level above). The schema endpoint is JSON, so it
    # does not need a relaxed CSP.
    location = /openapi.json {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # `location /docs` (prefix) also covers /docs/oauth2-redirect. ^~ stops nginx
    # from falling through to the regex-free SPA catch-all.
    location ^~ /docs {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Relaxed CSP for the docs UI only (replaces the inherited strict one).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;
    }

    location ^~ /redoc {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;
    }

    # ---- Hashed static assets ----
    # Vite emits content-hashed filenames under /assets/. They are safe to
    # cache forever and mark immutable.
    location /assets/ {
        try_files $uri =404;
        # Single explicit Cache-Control (no `expires`, which would emit a
        # second, conflicting Cache-Control header).
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-declare security headers: this block's add_header otherwise
        # replaces the server-level ones (nginx inheritance). Keep in sync.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        access_log off;
    }

    # ---- index.html ----
    # Never cache the app shell so clients always pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        # Re-declare security headers: this block's add_header otherwise
        # replaces the server-level ones (nginx inheritance). Keep in sync.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # ---- SPA history fallback ----
    # Serve the requested file, then a directory, then fall back to the
    # SPA shell so client-side routes (e.g. /services/1) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
